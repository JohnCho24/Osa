<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a1c"/>
      <stop offset="1" stop-color="#072014"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ff5722" stop-opacity="0.18"/>
