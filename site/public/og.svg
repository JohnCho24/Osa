    <pattern id="stripes" width="1200" height="63" patternUnits="userSpaceOnUse">
      <rect width="1200" height="63" fill="rgba(255,255,255,0.012)"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#pitch)"/>
