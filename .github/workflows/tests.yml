name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner fast and the install < 200 MB
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytorch-lightning einops numpy
          pip install fastapi 'pydantic>=2' uvicorn
          pip install pytest

      - name: Fetch sample data
        run: |
          # The server-validation test exercises _safe_match_path against a real file.
          # We only need the converted JSON, not the full Metrica clone.
          git clone --depth 1 https://github.com/metrica-sports/sample-data.git data/metrica
          python src/data/metrica_to_gentac.py

      - name: Run pytest
        run: pytest -v
