<text x="460.0" y="229" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="148" y="222" font-size="18" font-weight="800" fill="#0f172a">HTTP Middleware</text>
<text x="148" y="248" font-size="14.5" fill="#0f172a">CORS allowlist, body-size guard,</text>
<text x="148" y="266" font-size="14.5" fill="#0f172a">JSON logs, X-Request-Id.</text>
</g>
<path d="M 310 295 L 310 330" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
