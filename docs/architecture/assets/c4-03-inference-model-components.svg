<text x="460.0" y="369" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="148" y="362" font-size="18" font-weight="800" fill="#0f172a">Auth + Pydantic Schemas</text>
<text x="148" y="388" font-size="14.5" fill="#0f172a">Optional API key plus</text>
<text x="148" y="406" font-size="14.5" fill="#0f172a">GenerateRequest, PlayerArrow,</text>
<text x="148" y="424" font-size="14.5" fill="#0f172a">BallPassArrow bounds.</text>
</g>
<path d="M 310 435 L 310 470" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
