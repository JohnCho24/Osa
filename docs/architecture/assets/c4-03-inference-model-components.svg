<text x="1558" y="222" font-size="18" font-weight="800" fill="#1f102e">TrajectoryDataset</text>
<text x="1558" y="248" font-size="14.5" fill="#1f102e">Stable 11-player slots, normalized</text>
<text x="1558" y="266" font-size="14.5" fill="#1f102e">coordinates, validity masks.</text>
</g>
<g filter="url(#shadow)">
<rect x="1150" y="370" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1150" y="370" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1168" y="402" font-size="18" font-weight="800" fill="#1f102e">LinearBetaSchedule</text>
<text x="1168" y="428" font-size="14.5" fill="#1f102e">beta, alpha, alpha_bar tables and</text>
<text x="1168" y="446" font-size="14.5" fill="#1f102e">q_sample.</text>
</g>
<g filter="url(#shadow)">
<rect x="1540" y="370" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1540" y="370" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1558" y="402" font-size="18" font-weight="800" fill="#1f102e">GenTacTrajectoryModule</text>
<text x="1558" y="428" font-size="14.5" fill="#1f102e">cfg roundtrip, schema validation,</text>
<text x="1558" y="446" font-size="14.5" fill="#1f102e">EMA buffers, Lightning shell.</text>
</g>
<g filter="url(#shadow)">
<rect x="1150" y="550" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1150" y="550" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1168" y="582" font-size="18" font-weight="800" fill="#1f102e">TrajectoryTokenizer</text>
<text x="1168" y="608" font-size="14.5" fill="#1f102e">Coordinate, temporal, group, entity,</text>
<text x="1168" y="626" font-size="14.5" fill="#1f102e">and waypoint/null embeddings.</text>
</g>
<g filter="url(#shadow)">
<rect x="1540" y="550" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1540" y="550" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1558" y="582" font-size="18" font-weight="800" fill="#1f102e">GenTacDiffusion</text>
<text x="1558" y="608" font-size="14.5" fill="#1f102e">Epsilon-prediction network for</text>
<text x="1558" y="626" font-size="14.5" fill="#1f102e">future-window noise.</text>
</g>
<g filter="url(#shadow)">
<rect x="1150" y="730" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1150" y="730" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1168" y="762" font-size="18" font-weight="800" fill="#1f102e">SpatioTemporalBackbone</text>
<text x="1168" y="788" font-size="14.5" fill="#1f102e">Factorized temporal and entity</text>
<text x="1168" y="806" font-size="14.5" fill="#1f102e">attention blocks.</text>
</g>
<g filter="url(#shadow)">
<rect x="1540" y="730" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1540" y="730" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1558" y="762" font-size="18" font-weight="800" fill="#1f102e">causal_rollout</text>
<text x="1558" y="788" font-size="14.5" fill="#1f102e">w-frame reverse diffusion windows,</text>
<text x="1558" y="806" font-size="14.5" fill="#1f102e">hard pins, learned waypoints.</text>
</g>
<g filter="url(#shadow)">
<rect x="1150" y="910" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1150" y="910" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1168" y="942" font-size="18" font-weight="800" fill="#1f102e">apply_physics</text>
<text x="1168" y="968" font-size="14.5" fill="#1f102e">Seam anchor, speed caps, smoothing,</text>
<text x="1168" y="986" font-size="14.5" fill="#1f102e">pitch clamp, repulsion, final</text>
<text x="1168" y="1004" font-size="14.5" fill="#1f102e">re-clip.</text>
</g>
<g filter="url(#shadow)">
<rect x="1540" y="910" width="330" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1540" y="910" width="330" height="8" rx="4" fill="#7e22ce"/>
<text x="1558" y="942" font-size="18" font-weight="800" fill="#1f102e">Frame Serializer</text>
<text x="1558" y="968" font-size="14.5" fill="#1f102e">Rounds meter-space team/player/ball</text>
<text x="1558" y="986" font-size="14.5" fill="#1f102e">frames into response JSON.</text>
</g>
