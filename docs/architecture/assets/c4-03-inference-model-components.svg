<text x="460.0" y="509" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="148" y="502" font-size="18" font-weight="800" fill="#0f172a">Queue Guard</text>
<text x="148" y="528" font-size="14.5" fill="#0f172a">Semaphore caps active generations;</text>
<text x="148" y="546" font-size="14.5" fill="#0f172a">queue cap returns 503 early.</text>
</g>
