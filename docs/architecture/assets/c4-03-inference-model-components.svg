<rect x="560" y="550" width="360" height="115" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="560" y="550" width="360" height="8" rx="4" fill="#b91c1c"/>
<text x="578" y="582" font-size="18" font-weight="800" fill="#450a0a">Processed Match JSON</text>
<text x="578" y="608" font-size="14.5" fill="#450a0a">data/processed/*.json cached as</text>
<text x="578" y="626" font-size="14.5" fill="#450a0a">positions, masks, periods, frame IDs.</text>
</g>
<g filter="url(#shadow)">
<rect x="560" y="730" width="360" height="115" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="560" y="730" width="360" height="8" rx="4" fill="#b91c1c"/>
<text x="578" y="762" font-size="18" font-weight="800" fill="#450a0a">Model Checkpoint</text>
<text x="578" y="788" font-size="14.5" fill="#450a0a">checkpoints/*/*.ckpt loaded through</text>
<text x="578" y="806" font-size="14.5" fill="#450a0a">GenTacTrajectoryModule.</text>
</g>
