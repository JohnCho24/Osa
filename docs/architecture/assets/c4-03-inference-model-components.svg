<text x="1168" y="222" font-size="18" font-weight="800" fill="#1f102e">GenTacConfig</text>
<text x="1168" y="248" font-size="14.5" fill="#1f102e">Pitch, 23 entities, 25 FPS, H=100,</text>
<text x="1168" y="266" font-size="14.5" fill="#1f102e">w=5, diffusion steps, waypoint CFG.</text>
</g>
