<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="50" font-size="30" font-weight="800" fill="#0f172a">C4 Level 3 - Inference And Model Components</text>
<text x="40" y="82" font-size="17" fill="#475569">Request path through FastAPI and into GenTac sampling internals.</text>
<rect x="70" y="120" width="950" height="1180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="154" font-size="18" font-weight="800" fill="#334155">FastAPI container: src/server/main.py</text>
<rect x="1090" y="120" width="1040" height="1180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1110" y="154" font-size="18" font-weight="800" fill="#334155">GenTac model package: src/model/*</text>
