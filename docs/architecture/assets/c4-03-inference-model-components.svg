<rect x="444" y="910" width="32" height="28" rx="14" fill="#0369a1"/>
<text x="460.0" y="929" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">6</text>
<text x="148" y="922" font-size="18" font-weight="800" fill="#0f172a">Plausibility Gate</text>
<text x="148" y="948" font-size="14.5" fill="#0f172a">Max reachable distance and minimum</text>
<text x="148" y="966" font-size="14.5" fill="#0f172a">player spacing checks.</text>
</g>
<path d="M 310 995 L 310 1030" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
<rect x="130" y="1030" width="360" height="105" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="130" y="1030" width="360" height="8" rx="4" fill="#0369a1"/>
<rect x="444" y="1050" width="32" height="28" rx="14" fill="#0369a1"/>
<text x="460.0" y="1069" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">7</text>
<text x="148" y="1062" font-size="18" font-weight="800" fill="#0f172a">_generate_sync</text>
<text x="148" y="1088" font-size="14.5" fill="#0f172a">Builds history, valid_static,</text>
<text x="148" y="1106" font-size="14.5" fill="#0f172a">target_mask, opponent future, K</text>
<text x="148" y="1124" font-size="14.5" fill="#0f172a">samples.</text>
</g>
<path d="M 310 1135 L 310 1170" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
<rect x="130" y="1170" width="360" height="105" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="130" y="1170" width="360" height="8" rx="4" fill="#0369a1"/>
<rect x="444" y="1190" width="32" height="28" rx="14" fill="#0369a1"/>
<text x="460.0" y="1209" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">8</text>
<text x="148" y="1202" font-size="18" font-weight="800" fill="#0f172a">Response Builder</text>
<text x="148" y="1228" font-size="14.5" fill="#0f172a">Denormalizes meters and returns</text>
<text x="148" y="1246" font-size="14.5" fill="#0f172a">history, actual_future, samples.</text>
</g>
<g filter="url(#shadow)">
<rect x="560" y="190" width="360" height="115" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="560" y="190" width="360" height="8" rx="4" fill="#0369a1"/>
<text x="578" y="222" font-size="18" font-weight="800" fill="#0f172a">Lifespan Loader</text>
<text x="578" y="248" font-size="14.5" fill="#0f172a">Loads checkpoint, restores</text>
<text x="578" y="266" font-size="14.5" fill="#0f172a">cfg/model/schedule, chooses MPS or CPU.</text>
</g>
<g filter="url(#shadow)">
<rect x="560" y="370" width="360" height="115" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="560" y="370" width="360" height="8" rx="4" fill="#0369a1"/>
<text x="578" y="402" font-size="18" font-weight="800" fill="#0f172a">SSE Stream Wrapper</text>
<text x="578" y="428" font-size="14.5" fill="#0f172a">/api/generate/stream emits metadata,</text>
<text x="578" y="446" font-size="14.5" fill="#0f172a">window chunks, done.</text>
</g>
