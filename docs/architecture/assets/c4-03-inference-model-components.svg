<rect x="444" y="770" width="32" height="28" rx="14" fill="#0369a1"/>
<text x="460.0" y="789" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="148" y="782" font-size="18" font-weight="800" fill="#0f172a">Arrow Mapper</text>
<text x="148" y="808" font-size="14.5" fill="#0f172a">Player pins, ball_pass pins,</text>
<text x="148" y="826" font-size="14.5" fill="#0f172a">recipient receiving stance offset.</text>
</g>
<path d="M 310 855 L 310 890" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
