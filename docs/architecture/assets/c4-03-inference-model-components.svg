<text x="148" y="642" font-size="18" font-weight="800" fill="#0f172a">Match Resolver</text>
<text x="148" y="668" font-size="14.5" fill="#0f172a">_safe_match_path, _get_match,</text>
<text x="148" y="686" font-size="14.5" fill="#0f172a">match_cache, processed JSON</text>
<text x="148" y="704" font-size="14.5" fill="#0f172a">arrays.</text>
</g>
