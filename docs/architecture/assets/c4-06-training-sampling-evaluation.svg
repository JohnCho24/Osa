<rect x="1320" y="815" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="1320" y="815" width="320" height="8" rx="4" fill="#a16207"/>
<text x="1338" y="847" font-size="18" font-weight="800" fill="#422006">scripts/eval.py</text>
<text x="1338" y="873" font-size="14.5" fill="#422006">ADE/FDE, diversity, speed,</text>
<text x="1338" y="891" font-size="14.5" fill="#422006">off-pitch, role ADE, arrow honor.</text>
</g>
