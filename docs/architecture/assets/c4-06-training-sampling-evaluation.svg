<text x="2038" y="558" font-size="14.5" fill="#450a0a">schema-versioned ckpt files</text>
</g>
<g filter="url(#shadow)">
<rect x="120" y="815" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="120" y="815" width="320" height="8" rx="4" fill="#a16207"/>
<text x="138" y="847" font-size="18" font-weight="800" fill="#422006">scripts/sample.py</text>
<text x="138" y="873" font-size="14.5" fill="#422006">Loads checkpoint, samples K</text>
<text x="138" y="891" font-size="14.5" fill="#422006">alternatives, applies physics.</text>
</g>
<g filter="url(#shadow)">
<rect x="520" y="815" width="320" height="105" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="520" y="815" width="320" height="8" rx="4" fill="#b91c1c"/>
<text x="538" y="847" font-size="18" font-weight="800" fill="#450a0a">samples.json</text>
<text x="538" y="873" font-size="14.5" fill="#450a0a">Renderer-ready actual vs generated</text>
<text x="538" y="891" font-size="14.5" fill="#450a0a">alternatives.</text>
</g>
