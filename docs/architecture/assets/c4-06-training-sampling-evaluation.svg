<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="50" font-size="30" font-weight="800" fill="#0f172a">C4 Dynamic View - Training, Sampling, And Evaluation Workflow</text>
<text x="40" y="82" font-size="17" fill="#475569">Separate lanes for data preparation, training, evaluation, and guardrails.</text>
<rect x="60" y="120" width="2280" height="210" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="80" y="154" font-size="18" font-weight="800" fill="#334155">Data preparation</text>
<rect x="60" y="390" width="2280" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="80" y="424" font-size="18" font-weight="800" fill="#334155">Training</text>
<rect x="60" y="750" width="2280" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="80" y="784" font-size="18" font-weight="800" fill="#334155">Sampling and evaluation</text>
<rect x="60" y="1030" width="2280" height="170" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="80" y="1064" font-size="18" font-weight="800" fill="#334155">Automated guardrails</text>
<g filter="url(#shadow)">
<rect x="120" y="185" width="320" height="105" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<rect x="120" y="185" width="320" height="8" rx="4" fill="#64748b"/>
<text x="138" y="217" font-size="18" font-weight="800" fill="#0f172a">Raw Tracking Data</text>
<text x="138" y="243" font-size="14.5" fill="#0f172a">Metrica sample data today; provider</text>
<text x="138" y="261" font-size="14.5" fill="#0f172a">data later.</text>
</g>
<g filter="url(#shadow)">
<rect x="520" y="185" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="520" y="185" width="320" height="8" rx="4" fill="#a16207"/>
<text x="538" y="217" font-size="18" font-weight="800" fill="#422006">Expected Conversion</text>
<text x="538" y="243" font-size="14.5" fill="#422006">Tracking feed to GenTac JSON and</text>
<text x="538" y="261" font-size="14.5" fill="#422006">dev clips. README documents this</text>
<text x="538" y="279" font-size="14.5" fill="#422006">stage.</text>
</g>
<g filter="url(#shadow)">
<rect x="920" y="185" width="320" height="105" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="920" y="185" width="320" height="8" rx="4" fill="#b91c1c"/>
<text x="938" y="217" font-size="18" font-weight="800" fill="#450a0a">Processed JSON Store</text>
<text x="938" y="243" font-size="14.5" fill="#450a0a">data/processed/*.json with frames,</text>
<text x="938" y="261" font-size="14.5" fill="#450a0a">ball, teams, pitch metadata.</text>
</g>
<g filter="url(#shadow)">
<rect x="120" y="470" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="120" y="470" width="320" height="8" rx="4" fill="#a16207"/>
<text x="138" y="502" font-size="18" font-weight="800" fill="#422006">GenTacDataModule</text>
<text x="138" y="528" font-size="14.5" fill="#422006">Discovers matches and creates</text>
<text x="138" y="546" font-size="14.5" fill="#422006">match-level validation split.</text>
</g>
<g filter="url(#shadow)">
<rect x="500" y="470" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="500" y="470" width="320" height="8" rx="4" fill="#a16207"/>
<text x="518" y="502" font-size="18" font-weight="800" fill="#422006">TrajectoryDataset</text>
<text x="518" y="528" font-size="14.5" fill="#422006">H=100 history plus w=5 future</text>
<text x="518" y="546" font-size="14.5" fill="#422006">windows, normalized coords, masks.</text>
</g>
<g filter="url(#shadow)">
<rect x="880" y="470" width="320" height="105" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="880" y="470" width="320" height="8" rx="4" fill="#7e22ce"/>
<text x="898" y="502" font-size="18" font-weight="800" fill="#1f102e">GenTacTrajectoryModule</text>
<text x="898" y="528" font-size="14.5" fill="#1f102e">Random pretrain mode, optimizer,</text>
<text x="898" y="546" font-size="14.5" fill="#1f102e">cosine schedule, EMA.</text>
</g>
<g filter="url(#shadow)">
<rect x="1260" y="470" width="320" height="105" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<rect x="1260" y="470" width="320" height="8" rx="4" fill="#7e22ce"/>
<text x="1278" y="502" font-size="18" font-weight="800" fill="#1f102e">DDPM Training Step</text>
<text x="1278" y="528" font-size="14.5" fill="#1f102e">Synthetic waypoints, CFG dropout,</text>
<text x="1278" y="546" font-size="14.5" fill="#1f102e">q_sample, epsilon loss.</text>
</g>
<g filter="url(#shadow)">
<rect x="1640" y="435" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="1640" y="435" width="320" height="8" rx="4" fill="#a16207"/>
<text x="1658" y="467" font-size="18" font-weight="800" fill="#422006">Smoke Training</text>
<text x="1658" y="493" font-size="14.5" fill="#422006">scripts/smoke_train.py. Tiny Mac</text>
<text x="1658" y="511" font-size="14.5" fill="#422006">MPS/CPU run.</text>
</g>
<g filter="url(#shadow)">
<rect x="1640" y="560" width="320" height="105" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<rect x="1640" y="560" width="320" height="8" rx="4" fill="#a16207"/>
<text x="1658" y="592" font-size="18" font-weight="800" fill="#422006">Full Training</text>
<text x="1658" y="618" font-size="14.5" fill="#422006">scripts/train_full.py and</text>
<text x="1658" y="636" font-size="14.5" fill="#422006">modal_train.py on A100/H100.</text>
</g>
