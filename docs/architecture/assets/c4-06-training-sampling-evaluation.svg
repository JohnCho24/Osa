<rect x="920" y="815" width="320" height="105" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="920" y="815" width="320" height="8" rx="4" fill="#15803d"/>
<text x="938" y="847" font-size="18" font-weight="800" fill="#052e16">2D Renderer</text>
<text x="938" y="873" font-size="14.5" fill="#052e16">?samples=1 compares offline</text>
<text x="938" y="891" font-size="14.5" fill="#052e16">samples.</text>
</g>
